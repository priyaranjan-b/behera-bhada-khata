<!doctype html>
<!--
  Shown by public/sw.js when a page can't load because the phone is offline.
  Self-contained (no app scripts or fonts, which may not be reachable), so its
  colours are written out here: the slate canvas and brand indigo from
  src/theme/. Reloads by itself when the connection comes back.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>You're offline · MyRentHQ</title>
    <style>
      :root {
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --primary: #4b42c9;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #05070a;
          --card: #0d1017;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: #1e2533;
          --primary: #8b85f0;
          --on-primary: #0d1017;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 16px 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>MyRentHQ needs an internet connection to show your rent book. It will open again as soon as you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
