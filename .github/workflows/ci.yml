name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes test/schema.test.ts: every migration applied to an in-process Postgres.
      - run: npm test
      # Needs no secrets: the environment is validated at server start, not at build.
      - run: npm run build
